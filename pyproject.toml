[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "tracefix"
version = "0.1.0"
description = "Target-aware agent diagnosis and controlled optimization"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "langchain-ollama>=1,<2",
    "langfuse>=3,<4",
    "langgraph>=1,<2",
    "ollama>=0.6,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pymysql[rsa]>=1.1,<2",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
tracefix-db = "tracefix.persistence.cli:main"
tracefix-smoke-ollama = "tracefix.common.ollama_smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = ["integration: opt-in checks requiring live local services"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
